name: windows-mingw

# MinGW-w64 (MSYS2 UCRT64) Windows builds, beside wheels.yml and ci.yml, which
# this does not touch: on dispatch, on its own branches, and on v* tags.
#
#   openblas     the static OpenBLAS, both thread servers (cached)
#   linux-ref    onec on Linux from the same submodule commit: the reference
#   onec         onec.exe (generic, avx2) x (win32, omp): import gate, OpenNEC's
#                golden and sequential suites, impedance against linux-ref,
#                thread control, exit soak, indicative timing, the zip
#   wheel        the cp312-abi3 wheel from MinGW, on python.org's CPython
#   wheel-test   the package's test suite on 3.12, 3.13, 3.14
#   coexist      beside momwire and pynec-accel, every import order; exit soak

#   release      on a v* tag only: attach onec-windows-x64.zip to the release
#                wheels.yml creates
#
# Signing, one mode per run: the real Azure Artifact Signing certificate on a
# v* tag or an azure_sign dispatch, a self-signed rehearsal on every other
# run. The four builds are signed right after they are built, so every gate
# below runs the signed bytes; no CI path ships an unsigned onec.exe.

on:
  workflow_dispatch:
    inputs:
      azure_sign:
        description: "Sign with the REAL Azure certificate (no tag, no release)"
        type: boolean
        default: false
  push:
    branches: [mingw-windows, mingw-windows-release]
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  openblas:
    name: openblas ${{ matrix.blas }}
    runs-on: windows-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        blas: [win32, omp]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: ob
          key: openblas-ucrt64-${{ matrix.blas }}-${{ hashFiles('tools/windows/build_openblas.sh') }}
      - uses: msys2/setup-msys2@v2
        if: steps.cache.outputs.cache-hit != 'true'
        with:
          msystem: UCRT64
          update: false
          install: >-
            git make perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: |
          gcc --version | head -1
          tools/windows/build_openblas.sh "$PWD/ob" ${{ matrix.blas }}
          rm -rf ob/src ob/build.log
      - uses: actions/upload-artifact@v4
        with:
          name: openblas-${{ matrix.blas }}
          path: ob
          retention-days: 7

  linux-ref:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build onec
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenblas-dev liblapack-dev gfortran pkg-config
          bash tools/build_onec.sh build/onec
      - name: Run the decks
        run: |
          python -m pip install -q psutil
          python tools/windows/make_decks.py decks
          python tools/windows/onec_gate.py run --exe build/onec/onec --decks decks --out ref
      - uses: actions/upload-artifact@v4
        with:
          name: linux-ref
          path: ref
          retention-days: 7

  onec:
    needs: [openblas, linux-ref]
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
      - uses: actions/download-artifact@v4
        with:
          pattern: openblas-*
          path: ob
      - uses: actions/download-artifact@v4
        with:
          name: linux-ref
          path: ref
      - name: Build the four onec.exe
        shell: msys2 {0}
        run: |
          set -e
          gcc --version | head -1
          for blas in win32 omp; do
            for arch in generic avx2; do
              tools/windows/build_onec.sh "b/$blas-$arch" "ob/openblas-$blas/libopenblas.a" "$arch"
            done
          done
      - name: Decide the signing mode
        shell: pwsh
        env:
          AZURE_SIGN: ${{ inputs.azure_sign }}
        run: |
          $mode = if ($env:GITHUB_REF_TYPE -eq 'tag' -or $env:AZURE_SIGN -eq 'true') { 'azure' } else { 'rehearsal' }
          "ONEC_SIGN_MODE=$mode" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "signing mode: $mode"
      - name: Rehearsal certificate (self-signed, never on tags)
        if: env.ONEC_SIGN_MODE == 'rehearsal'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=onec rehearsal (NOT a release certificate)" -CertStoreLocation Cert:\CurrentUser\My
          "ONEC_SIGN_SHA1=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # The Azure stanza is momwire's (standalone.yml): the same account and
      # profile, the dlib on the .NET 8 runtime, and nuget.exe rather than
      # actions/setup-dotnet, whose installer host has answered HTTP 409 since
      # 2026-10-25.
      - name: .NET 8 runtime (azure mode)
        if: env.ONEC_SIGN_MODE == 'azure'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $have = @(& dotnet --list-runtimes 2>$null) -match '^Microsoft\.NETCore\.App 8\.'
          if ($have) { $have; exit 0 }
          $dir = Join-Path $env:RUNNER_TEMP 'dotnet'
          $script = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest -Uri https://builds.dotnet.microsoft.com/dotnet/scripts/v1/dotnet-install.ps1 -OutFile $script
          & $script -Channel 8.0 -Runtime dotnet -InstallDir $dir -AzureFeed https://builds.dotnet.microsoft.com/dotnet
          if (-not (Test-Path (Join-Path $dir 'dotnet.exe'))) { throw ".NET 8 runtime did not install to $dir" }
          $dir | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          "DOTNET_ROOT=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Artifact Signing dlib and metadata (azure mode)
        if: env.ONEC_SIGN_MODE == 'azure'
        shell: pwsh
        timeout-minutes: 5
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest -Uri https://dist.nuget.org/win-x86-commandline/latest/nuget.exe -OutFile nuget.exe
          & ./nuget.exe install Microsoft.ArtifactSigning.Client -Version 1.0.128 -x -OutputDirectory packages
          $dlib = Get-ChildItem packages -Recurse -Filter Azure.CodeSigning.Dlib.dll |
                  Where-Object { $_.Directory.Name -eq 'x64' } | Select-Object -First 1
          if (-not $dlib) { throw "x64 Azure.CodeSigning.Dlib.dll not found in Microsoft.ArtifactSigning.Client" }
          $meta = [ordered]@{
            Endpoint               = "https://wus2.codesigning.azure.net"
            CodeSigningAccountName = "momwire"
            CertificateProfileName = "momwire-public-trust"
            ExcludeCredentials     = @(
              "ManagedIdentityCredential", "WorkloadIdentityCredential",
              "SharedTokenCacheCredential", "VisualStudioCredential",
              "VisualStudioCodeCredential", "AzureCliCredential",
              "AzurePowerShellCredential", "AzureDeveloperCliCredential",
              "InteractiveBrowserCredential")
          }
          $meta | ConvertTo-Json | Out-File metadata.json -Encoding utf8
          "ONEC_SIGN_DLIB=$($dlib.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ONEC_SIGN_METADATA=$((Resolve-Path metadata.json).Path)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      # One signtool invocation for the four builds, timestamped. In azure
      # mode the chain must verify and every file must carry a timestamp; the
      # rehearsal's self-signed root cannot chain, so it checks attachment only.
      - name: Sign the four onec.exe
        shell: pwsh
        env:
          AZURE_TENANT_ID: ${{ env.ONEC_SIGN_MODE == 'azure' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ env.ONEC_SIGN_MODE == 'azure' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ env.ONEC_SIGN_MODE == 'azure' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                      Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          if (-not $signtool) { throw "signtool.exe not found in the Windows Kits" }
          $exes = 'win32-generic','win32-avx2','omp-generic','omp-avx2' | ForEach-Object { (Resolve-Path "b/$_/onec.exe").Path }
          if ($env:ONEC_SIGN_MODE -eq 'azure') {
            if (-not $env:AZURE_CLIENT_SECRET) { throw "azure mode without the AZURE_* secrets on this repository" }
            $id = @('/dlib', $env:ONEC_SIGN_DLIB, '/dmdf', $env:ONEC_SIGN_METADATA)
          } else {
            $id = @('/sha1', $env:ONEC_SIGN_SHA1)
          }
          & $signtool.FullName sign /v /fd SHA256 /tr http://timestamp.acs.microsoft.com /td SHA256 @id @exes
          if ($LASTEXITCODE) { throw "signtool sign failed" }
          foreach ($e in $exes) {
            $s = Get-AuthenticodeSignature $e
            "$e : $($s.Status) $($s.SignerCertificate.Subject)"
            if (-not $s.SignerCertificate) { throw "$e is not signed" }
            if (-not $s.TimeStamperCertificate) { throw "$e carries no timestamp" }
            if ($env:ONEC_SIGN_MODE -eq 'azure' -and $s.Status -ne 'Valid') { throw "$e : $($s.Status)" }
          }
      - name: Import tables
        shell: pwsh
        run: |
          python -m pip install -q pefile psutil
          foreach ($b in 'win32-generic','win32-avx2','omp-generic','omp-avx2') {
            python tools/windows/pe_gate.py exe "b/$b/onec.exe"
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: A run from a System32-only PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32"
          foreach ($b in 'win32-generic','win32-avx2','omp-generic','omp-avx2') {
            & "b/$b/onec.exe" -v
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: OpenNEC's own suites
        shell: pwsh
        run: |
          foreach ($b in 'win32-generic','win32-avx2','omp-generic','omp-avx2') {
            "== $b"
            $exe = (Resolve-Path "b/$b/onec.exe").Path
            python opennec/tests/golden_tests/run_golden.py --onec $exe --decks opennec/tests/golden_tests/decks --expected opennec/tests/golden_tests/expected.json
            if ($LASTEXITCODE) { exit 1 }
            python opennec/tests/sequential_execution/run_sequential_execution_tests.py --onec $exe
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: Impedance against the Linux build, and timing (indicative)
        shell: pwsh
        run: |
          python tools/windows/make_decks.py decks
          python tools/windows/onec_gate.py control ref
          if ($LASTEXITCODE) { exit 1 }
          foreach ($b in 'win32-generic','win32-avx2','omp-generic','omp-avx2') {
            "== $b"
            python tools/windows/onec_gate.py run --exe "b/$b/onec.exe" --decks decks --out "out/$b"
            if ($LASTEXITCODE) { exit 1 }
            python tools/windows/onec_gate.py compare ref "out/$b"
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: Timing, interleaved on one runner (indicative only)
        shell: pwsh
        run: |
          foreach ($round in 1,2) {
            foreach ($b in 'win32-generic','win32-avx2','omp-generic','omp-avx2') {
              "== round $round $b"
              python tools/windows/onec_gate.py run --exe "b/$b/onec.exe" --decks decks --out "time/$round-$b" --only "synth_cage.nec,synth_lpy.nec"
              if ($LASTEXITCODE) { exit 1 }
            }
          }
      - name: Thread control
        shell: pwsh
        run: |
          foreach ($b in 'win32-generic','omp-generic') {
            "== $b"
            python tools/windows/onec_gate.py threads --exe "b/$b/onec.exe" --deck decks/synth_lpy.nec
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: Exit soak
        shell: pwsh
        run: |
          foreach ($b in 'win32-generic','omp-generic') {
            "== $b"
            python tools/windows/onec_gate.py soak --exe "b/$b/onec.exe" --deck decks/example5.nec --runs 1500
            if ($LASTEXITCODE) { exit 1 }
          }
      - name: The zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force zip | Out-Null
          Copy-Item b/win32-generic/onec.exe zip/onec.exe
          Copy-Item b/win32-avx2/onec.exe zip/onec-avx2.exe
          Copy-Item opennec/LICENSE zip/LICENSE.OpenNEC.txt
          Copy-Item LICENSE zip/LICENSE.pyopennec.txt
          Copy-Item tools/windows/THIRD-PARTY-NOTICES.txt, tools/windows/README-onec.txt zip/
          Rename-Item zip/README-onec.txt README.txt
          $c = git -C opennec rev-parse HEAD
          "OpenNEC $c`npyopennec ${{ github.sha }}`nOpenBLAS v0.3.34, Win32 thread server, DYNAMIC_ARCH (PRESCOTT NEHALEM SANDYBRIDGE HASWELL)`nMSYS2 UCRT64 gcc" | Set-Content zip/BUILD-INFO.txt
          Get-ChildItem zip | Format-Table Name, Length
      - name: Zip it (a rehearsal or SIGNTEST name unless this is the release)
        shell: pwsh
        run: |
          $stem = 'onec-windows-x64'
          $name = if ($env:GITHUB_REF_TYPE -eq 'tag') { $stem }
                  elseif ($env:ONEC_SIGN_MODE -eq 'azure') { "$stem-SIGNTEST" }
                  else { "$stem-SELFSIGNED-rehearsal" }
          Compress-Archive -Path zip/* -DestinationPath "$name.zip"
          New-Item -ItemType Directory -Force dist | Out-Null
          Move-Item "$name.zip" dist/
          Get-ChildItem dist | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: onec-windows-x64-mingw
          path: dist
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: onec-all-builds
          path: |
            b/*/onec.exe
            out/*/*.out
            out/*/times.json
            time/*/times.json
          retention-days: 7

  wheel:
    name: wheel ${{ matrix.blas }}
    needs: openblas
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        blas: [win32, omp]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: UCRT64
          update: false
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-libgomp
            mingw-w64-ucrt-x86_64-ninja
      - uses: actions/download-artifact@v4
        with:
          name: openblas-${{ matrix.blas }}
          path: ob
      - name: Build the wheel with MinGW, for python.org's CPython
        shell: pwsh
        run: |
          $env:PATH = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin;$env:PATH"
          $env:CC = "gcc"
          $env:CMAKE_GENERATOR = "Ninja"
          $lib = ((Resolve-Path ob/libopenblas.a).Path) -replace '\\','/'
          python -c "import sys; print(sys.version)"
          python -m pip install -q --upgrade pip
          python -m pip wheel . --no-deps -w dist -v `
            "--config-settings=cmake.define.PYOPENNEC_BLAS=static-openblas" `
            "--config-settings=cmake.define.PYOPENNEC_OPENBLAS_LIB=$lib" `
            "--config-settings=cmake.define.PYOPENNEC_REQUIRE_OPENMP=ON"
          if ($LASTEXITCODE) { exit 1 }
          Get-ChildItem dist | Format-Table Name, Length
      - name: The wheel's contents, imports and exports
        shell: pwsh
        run: |
          python -m pip install -q pefile
          $whl = (Get-ChildItem dist/*.whl).FullName
          if ($whl -notmatch 'cp312-abi3-win_amd64') { throw "wrong tag: $whl" }
          python -m zipfile -l $whl
          python -m zipfile -e $whl x
          python tools/windows/pe_gate.py pyd x/pyopennec/_porty.pyd
          if ($LASTEXITCODE) { exit 1 }
          if (-not (Test-Path x/pyopennec/THIRD-PARTY-NOTICES.txt)) { throw "no notices in the wheel" }
          if (Get-ChildItem -Recurse x -Include *.dll) { throw "the wheel vendors a DLL" }
      - name: onec for the suite's CLI cross-checks
        shell: msys2 {0}
        run: tools/windows/build_onec.sh onec-test ob/libopenblas.a generic
      - uses: actions/upload-artifact@v4
        with:
          name: onec-test-${{ matrix.blas }}
          path: onec-test/onec.exe
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-windows-mingw-${{ matrix.blas }}
          path: dist/*.whl
          retention-days: 30

  wheel-test:
    name: test ${{ matrix.blas }} py${{ matrix.python }}
    needs: wheel
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        blas: [win32, omp]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows-mingw-${{ matrix.blas }}
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: onec-test-${{ matrix.blas }}
          path: onecdir
      - name: Install and test the wheel
        shell: pwsh
        env:
          PYOPENNEC_EXPECT_BACKEND: static-openblas
          PYOPENNEC_EXPECT_OPENMP: "1"
          OMP_NUM_THREADS: "4"
        run: |
          python -m venv v
          v\Scripts\python -m pip install -q --upgrade pip
          v\Scripts\python -m pip install -q (Get-ChildItem dist/*.whl).FullName pytest
          v\Scripts\python -c "import sys, pyopennec as p; print(sys.version); print(p.__version__, p.BACKEND, p.OPENMP, p.OPENNEC_VERSION, p._porty.__file__)"
          if ($LASTEXITCODE) { exit 1 }
          $env:PYOPENNEC_ONEC = (Resolve-Path onecdir/onec.exe).Path
          v\Scripts\python -m pytest tests -p no:cacheprovider -ra
          if ($LASTEXITCODE) { exit 1 }
          v\Scripts\python tools/windows/large_solve.py $env:PYOPENNEC_ONEC
          exit $LASTEXITCODE

  coexist:
    name: coexist ${{ matrix.blas }} py${{ matrix.python }}
    needs: wheel
    runs-on: windows-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        blas: [win32, omp]
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: wheel-windows-mingw-${{ matrix.blas }}
          path: dist
      - name: Install the three engines
        shell: pwsh
        run: |
          python -m venv v
          v\Scripts\python -m pip install -q --upgrade pip
          v\Scripts\python -m pip install -q (Get-ChildItem dist/*.whl).FullName momwire pynec-accel scipy
          v\Scripts\python -m pip list
      - name: One process, every import order
        shell: pwsh
        run: |
          v\Scripts\python tools/windows/coexist.py
          exit $LASTEXITCODE
      - name: Exit soak (fresh processes)
        shell: pwsh
        run: |
          v\Scripts\python tools/windows/coexist.py --soak 1000
          exit $LASTEXITCODE

  # wheels.yml creates the release on the same tag; this attaches the zip to
  # it once it exists, so neither workflow waits on the other's gates.
  release:
    name: attach onec-windows-x64.zip
    needs: [onec, wheel-test, coexist]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: onec-windows-x64-mingw
          path: dist
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l dist
          test -f dist/onec-windows-x64.zip
          for i in $(seq 1 50); do
            gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 && break
            echo "release $TAG not created yet ($i)"; sleep 60
          done
          gh release upload "$TAG" dist/onec-windows-x64.zip -R "$GITHUB_REPOSITORY"
